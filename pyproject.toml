[project]
name = "credisync-underwriting"
version = "0.1.0"
description = "CrediSync Underwriting multi-agent platform"
readme = "README.md"
authors = [
    { name = "Mitchell Odili", email = "mitchellodili@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "google-adk",
    "google-cloud-spanner>=3.70.0",
    "pydantic",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "shared*"]
